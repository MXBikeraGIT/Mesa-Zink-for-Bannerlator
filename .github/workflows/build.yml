name: Build Mesa 25.2 Zink Android aarch64

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version"
        required: true
        default: "25.2.0"

      gallium_drivers:
        description: "Gallium drivers"
        required: true
        default: "zink,softpipe"

      api_level:
        description: "Android API level"
        required: true
        default: "28"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bison \
            flex \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3-mako \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            glslang-tools

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Download Mesa
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "mesa-${{ inputs.mesa_version }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Create Android Meson cross file
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
          API_LEVEL: ${{ inputs.api_level }}
        run: |
          set -eux

          NDK_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang++'
          ar = '${NDK_BIN}/llvm-ar'
          ranlib = '${NDK_BIN}/llvm-ranlib'
          strip = '${NDK_BIN}/llvm-strip'
          objcopy = '${NDK_BIN}/llvm-objcopy'
          ld = '${NDK_BIN}/ld.lld'
          pkg-config = ''

          [host_machine]
          system = 'android'
          kernel = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = [
            '-D__ANDROID_API__=${API_LEVEL}',
            '-fPIC'
          ]

          cpp_args = [
            '-D__ANDROID_API__=${API_LEVEL}',
            '-fPIC'
          ]

          c_link_args = [
            '-fuse-ld=lld',
            '-Wl,--no-rosegment'
          ]

          cpp_link_args = [
            '-fuse-ld=lld',
            '-Wl,--no-rosegment'
          ]
          EOF

      - name: Configure Mesa
        env:
          GALLIUM_DRIVERS: ${{ inputs.gallium_drivers }}
          API_LEVEL: ${{ inputs.api_level }}
        run: |
          set -eux

          meson setup build-android mesa \
            --cross-file android-aarch64.ini \
            --buildtype=release \
            --prefix=/data/local/tmp/mesa \
            --libdir=lib \
            -Dplatforms=android \
            -Dplatform-sdk-version="${API_LEVEL}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-liblog=enabled \
            -Dandroid-libcutils=disabled \
            -Dandroid-ndk-version=27 \
            -Degl=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers="${GALLIUM_DRIVERS}" \
            -Dvulkan-drivers= \
            -Dgallium-va=disabled \
            -Dgallium-vdpau=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-omx=disabled \
            -Dgallium-nine=false \
            -Dgallium-opencl=disabled \
            -Dbuild-tests=false \
            -Dtools=[]

      - name: Build Mesa
        run: |
          set -eux
          meson compile -C build-android

      - name: Install Mesa to staging directory
        run: |
          set -eux

          rm -rf stage

          DESTDIR="$PWD/stage" \
            meson install -C build-android

      - name: Create archive
        env:
          MESA_VERSION: ${{ inputs.mesa_version }}
        run: |
          set -eux

          tar \
            -C stage \
            -czf "mesa-${MESA_VERSION}-android-aarch64-zink.tar.gz" \
            .

      - name: Upload Mesa archive
        uses: actions/upload-artifact@v4
        with:
          name: mesa-${{ inputs.mesa_version }}-android-aarch64-zink
          path: mesa-${{ inputs.mesa_version }}-android-aarch64-zink.tar.gz.
