name: Build Mesa 25.2 Zink (Android aarch64, plain Meson + NDK)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa release tag, for example 25.2.0"
        required: false
        default: "25.2.0"
      gallium_drivers:
        description: "Comma-separated Gallium drivers"
        required: false
        default: "zink,softpipe"
      api_level:
        description: "Android API level to target"
        required: false
        default: "28"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install host tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            flex \
            glslang-tools \
            libclang-dev \
            libexpat1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-glx0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libzstd-dev \
            meson \
            ninja-build \
            pkg-config \
            python3-mako \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            zlib1g-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Clone Mesa
        run: |
          set -eux
          git clone --depth 1 \
            --branch "mesa-${{ inputs.mesa_version }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Write Android aarch64 Meson cross file
        run: |
          set -eux

          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="${{ inputs.api_level }}"

          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android${API}-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android${API}-clang++'
          ar = '${NDK_BIN}/llvm-ar'
          ranlib = '${NDK_BIN}/llvm-ranlib'
          strip = '${NDK_BIN}/llvm-strip'
          objcopy = '${NDK_BIN}/llvm-objcopy'
          ld = '${NDK_BIN}/ld.lld'
          pkg-config = ''

          [host_machine]
          system = 'android'
          kernel = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = [
            '-D__ANDROID_API__=${API}',
            '-fPIC'
          ]
          cpp_args = [
            '-D__ANDROID_API__=${API}',
            '-fPIC'
          ]
          c_link_args = [
            '-fuse-ld=lld',
            '-Wl,--no-rosegment'
          ]
          cpp_link_args = [
            '-fuse-ld=lld',
            '-Wl,--no-rosegment'
          ]
          EOF

      - name: Configure Mesa with Meson
        env:
          GALLIUM_DRIVERS: ${{ inputs.gallium_drivers }}
          API_LEVEL: ${{ inputs.api_level }}
        run: |
          set -eux

          meson setup build-android \
            mesa \
            --cross-file android-aarch64.ini \
            --buildtype=release \
            --prefix=/data/local/tmp/mesa \
            --libdir=lib \
            -Dplatforms=android \
            -Dplatform-sdk-version="${API_LEVEL}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-liblog=enabled \
            -Degl=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers="${GALLIUM_DRIVERS}" \
            -Dvulkan-drivers= \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-omx=disabled \
            -Dgallium nine=false \
            -Dbuild-tests=false \
            -Dtools=

      - name: Build Mesa
        run: |
          set -eux
          meson compile -C build-android

      - name: Install into staging directory
        run: |
          set -eux
          DESTDIR="$PWD/stage" meson install -C build-android

      - name: Package build
        run: |
          set -eux
          tar -C stage -czf \
            "mesa-${{ inputs.mesa_version }}-android-aarch64-zink.tar.gz" \
            .

      - name: Upload Mesa artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-${{ inputs.mesa_version }}-android-aarch64-zink
          path: mesa-${{ inputs.mesa_version }}-android-aarch64-zink.tar.gz
