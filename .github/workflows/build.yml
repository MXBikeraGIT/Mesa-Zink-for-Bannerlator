name: Build Mesa 25.2 Zink (bionic aarch64, plain meson+NDK)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa release version (must exist at archive.mesa3d.org)'
        required: false
        default: '25.2.0'
      gallium_drivers:
        description: 'Gallium drivers to build'
        required: false
        default: 'zink,softpipe'
      api_level:
        description: 'Android API level to target'
        required: false
        default: '28'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-mako ninja-build bison flex pkg-config
          pip install --user meson

      - name: Fetch prebuilt bionic deps from Termux repo
        run: |
          set -e
          mkdir -p sysroot
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages.gz" -o Packages.gz
          gunzip -f Packages.gz

          # Packages needed for the x11/dri build of zink. If linking fails
          # later complaining about an unresolved symbol/lib, it's probably
          # missing from this list — add it and re-run.
          PKGS="libandroid-shmem libdrm libx11 libxcb libxau libxdmcp libxext libxfixes libxshmfence libxxf86vm xorgproto zstd"

          for pkg in $PKGS; do
            fname=$(awk -v p="$pkg" '
              $1=="Package:" {name=$2}
              $1=="Filename:" && name==p {print $2; exit}
            ' Packages)
            if [ -z "$fname" ]; then
              echo "WARNING: could not find $pkg in Termux repo index, skipping"
              continue
            fi
            echo "Fetching $pkg -> $fname"
            curl -fsSL "$BASE/$fname" -o "$pkg.deb"
            dpkg-deb -x "$pkg.deb" sysroot
          done

          find sysroot -maxdepth 6 -type d | head -n 40

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch "mesa-${{ inputs.mesa_version }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Write meson cross file
        run: |
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=${{ inputs.api_level }}
          SYSROOT_EXTRA="$PWD/sysroot/data/data/com.termux/files/usr"

          cat > cross.ini <<EOF
          [binaries]
          c = '$NDK_BIN/aarch64-linux-android${API}-clang'
          cpp = '$NDK_BIN/aarch64-linux-android${API}-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-I$SYSROOT_EXTRA/include']
          cpp_args = ['-I$SYSROOT_EXTRA/include']
          c_link_args = ['-L$SYSROOT_EXTRA/lib', '-Wl,-rpath-link,$SYSROOT_EXTRA/lib']
          cpp_link_args = ['-L$SYSROOT_EXTRA/lib', '-Wl,-rpath-link,$SYSROOT_EXTRA/lib']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          echo "PKG_CONFIG_PATH=$SYSROOT_EXTRA/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$PWD/sysroot" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: mesa
        env:
          LDFLAGS: '-landroid-shmem -llog'
        run: |
          meson setup build \
            --cross-file ../cross.ini \
            -Dplatforms=x11 \
            -Dglx=dri \
            -Dgallium-drivers=${{ inputs.gallium_drivers }} \
            -Dvulkan-drivers= \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dstrip=true

      - name: Build
        working-directory: mesa
        run: ninja -C build

      - name: Collect driver .so
        run: |
          mkdir -p out
          find mesa/build -name '*_dri.so' -exec cp -v {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zink-mesa-${{ inputs.mesa_version }}-bionic-aarch64
          path: out/
