name: Build Mesa 25.2 Zink (bionic aarch64, plain meson+NDK)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa release version (must exist at archive.mesa3d.org)'
        required: false
        default: '25.2.0'
      gallium_drivers:
        description: 'Gallium drivers to build'
        required: false
        default: 'zink,softpipe'
      api_level:
        description: 'Android API level to target'
        required: false
        default: '28'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-mako ninja-build bison flex pkg-config
          pip install --user meson

      - name: Fetch bionic deps via sandboxed apt (main + x11-repo)
        run: |
          set -e
          APTROOT="$PWD/aptroot"
          SYSROOT="$PWD/sysroot"
          mkdir -p "$APTROOT/lists" "$APTROOT/archives/partial" "$SYSROOT"
          : > "$APTROOT/status"

          cat > "$APTROOT/sources.list" <<EOF
          deb https://packages.termux.dev/apt/termux-main stable main
          deb https://packages.termux.dev/apt/termux-x11 x11 main
          EOF

          APT_OPTS=(
            -o Dir::State::status="$APTROOT/status"
            -o Dir::Etc::SourceList="$APTROOT/sources.list"
            -o Dir::Etc::SourceParts=/dev/null
            -o Dir::Cache="$APTROOT"
            -o Dir::State::Lists="$APTROOT/lists"
            -o APT::Architecture=aarch64
            -o APT::Architectures::=aarch64
            -o Acquire::Languages=none
          )

          apt-get "${APT_OPTS[@]}" update

          # Top-level packages only — apt resolves libxcb/libxau/libxdmcp/
          # libxext/etc transitively, so we don't hand-maintain that list.
          apt-get "${APT_OPTS[@]}" --download-only -y install \
            libandroid-shmem libdrm libx11 libxfixes libxshmfence \
            libxxf86vm libpixman libjpeg-turbo libxdamage libxinerama \
            libxfont2 libxkbfile libpciaccess xcb-util-renderutil \
            xcb-util-image xcb-util-keysyms xcb-util-wm xorg-xrandr \
            xorg-xkbcomp xkeyboard-config xorg-font-util xorg-util-macros \
            xorgproto zstd

          for deb in "$APTROOT"/archives/*.deb; do
            echo "Extracting $(basename "$deb")"
            dpkg-deb -x "$deb" "$SYSROOT"
          done

          find "$SYSROOT" -maxdepth 6 -type d | head -n 40

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch "mesa-${{ inputs.mesa_version }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Write meson cross file
        run: |
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=${{ inputs.api_level }}
          SYSROOT_EXTRA="$PWD/sysroot/data/data/com.termux/files/usr"

          cat > cross.ini <<EOF
          [binaries]
          c = '$NDK_BIN/aarch64-linux-android${API}-clang'
          cpp = '$NDK_BIN/aarch64-linux-android${API}-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-I$SYSROOT_EXTRA/include']
          cpp_args = ['-I$SYSROOT_EXTRA/include']
          c_link_args = ['-L$SYSROOT_EXTRA/lib', '-Wl,-rpath-link,$SYSROOT_EXTRA/lib']
          cpp_link_args = ['-L$SYSROOT
